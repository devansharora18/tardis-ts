[package]
name = "tardis-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native scene layout, text, and raster core for TardisJS"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.5"
cosmic-text = "0.12"
tiny-skia = { version = "0.11", features = ["png-format"] }

[dev-dependencies]
tempfile = "3"
